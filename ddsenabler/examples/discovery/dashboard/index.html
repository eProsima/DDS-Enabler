<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DDS Enabler — Discovery Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>DDS Enabler — Discovery Dashboard</h1>
    <div class="connection">
      <label for="ws-url">WebSocket URL</label>
      <input id="ws-url" type="text" value="ws://localhost:8080" />
      <button id="connect-btn" type="button">Connect</button>
      <span id="status" class="status disconnected">Disconnected</span>
    </div>
  </header>

  <main>
    <section id="topics" class="panel">
      <h2>Topics <span class="badge" id="topics-count">0</span></h2>
      <ul class="items" id="topics-list"></ul>
      <p class="empty" id="topics-empty">No topics discovered yet.</p>
    </section>

    <section id="services" class="panel">
      <h2>Services <span class="badge" id="services-count">0</span></h2>
      <ul class="items" id="services-list"></ul>
      <p class="empty" id="services-empty">No services discovered yet.</p>
    </section>

    <section id="actions" class="panel">
      <h2>Actions <span class="badge" id="actions-count">0</span></h2>
      <ul class="items" id="actions-list"></ul>
      <p class="empty" id="actions-empty">No actions discovered yet.</p>
    </section>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
